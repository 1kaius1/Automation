---
# ============================================
# Steam-Linux Backup (on-demand vzdump)
# ============================================
#
# Triggers a vzdump of the Steam-Linux VM to backup_storage_target, which
# is expected to be OFF-NODE storage (Proxmox Backup Server, or an
# NFS/CIFS share) — a same-node backup does not survive that node's
# hardware failure. See the Disaster Recovery section of README.md.
#
# This backs up the VM as a whole (base host + every instance under
# /opt/data/steam/), not a single game-server instance.
#
# Expects steam_vm_vmid to already be set (passed explicitly when run via
# create-steam_linux_backup.yaml).
# ============================================

- name: Fail if steam_vm_vmid isn't known
  ansible.builtin.fail:
    msg: >
      steam_vm_vmid is not set. Pass -e steam_vm_vmid=<vmid> when running
      create-steam_linux_backup.yaml.
  when: steam_vm_vmid is not defined

- name: Trigger a vzdump backup to the off-node target
  community.proxmox.proxmox_backup:
    mode: include
    vmids:
      - "{{ steam_vm_vmid }}"
    node: "{{ proxmox_node }}"
    storage: "{{ backup_storage_target }}"
    backup_mode: snapshot
    compress: zstd
    wait: true
    wait_timeout: "{{ steam_backup_wait_timeout }}"
  register: steam_backup_result

- name: Backup complete
  ansible.builtin.debug:
    msg: "Backup of VMID {{ steam_vm_vmid }} to {{ backup_storage_target }} finished: {{ steam_backup_result }}"
