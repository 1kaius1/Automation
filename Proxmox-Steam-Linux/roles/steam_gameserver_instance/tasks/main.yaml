---
# ============================================
# Steam Game Server Instance (generic)
# ============================================
#
# Installs/updates ONE game-server instance via SteamCMD and runs it as
# its own systemd unit. Deliberately contains NO game-specific knowledge
# — every value comes from steam_gameserver_instance_* vars, normally
# supplied via -e @<instance vars file> (see gameservers/hlds-dm01.vars.yaml
# for a real invocation). Game-specific config (server.cfg, mapcycle.txt, ...)
# is layered on top by a separate <game>_config role, included dynamically
# by create-steam_gameserver.yaml — see roles/hlds_dm_config for the
# pattern every future game's own config role would follow.
#
# This is the reusable "install this AppID on this host" building block —
# see README.md "Known limitations / next steps" for how this generalizes
# into a data-driven, multi-instance mechanism.
#
# INSTALL-ONLY: SteamCMD runs here only when the app is not installed yet.
# An already-installed instance is never re-updated by this role — upgrades
# and beta-branch changes belong to update-steam_gameserver.yaml (role
# steam_gameserver_update), which stops the server first. That keeps this
# role idempotent (a re-run never bounces a healthy server). See README.md
# "Updating game servers".
# ============================================

- name: Assert required instance vars are set
  ansible.builtin.assert:
    that:
      - steam_gameserver_instance_name is defined
      - steam_gameserver_instance_appid is defined
      - steam_gameserver_instance_launch_binary is defined
      - steam_gameserver_instance_launch_args is defined
      - steam_gameserver_instance_port is defined
    fail_msg: >-
      steam_gameserver_instance_{name,appid,launch_binary,launch_args,port}
      must all be set — pass an instance vars file with -e @<path>, e.g.
      gameservers/hlds-dm01.vars.yaml.
    quiet: true

- name: Compute this instance's install directory
  ansible.builtin.set_fact:
    steam_gameserver_instance_install_dir: "{{ steam_home_dir }}/{{ steam_gameserver_instance_name }}"

- name: Create the instance's install directory
  ansible.builtin.file:
    path: "{{ steam_gameserver_instance_install_dir }}"
    state: directory
    owner: "{{ steam_system_user }}"
    group: "{{ steam_system_user }}"
    mode: '0750'
  become: true

- name: Create the instance's game-data directory
  ansible.builtin.file:
    path: "{{ steam_gameserver_instance_data_dir }}"
    state: directory
    owner: "{{ steam_system_user }}"
    group: "{{ steam_system_user }}"
    mode: '0750'
  become: true

- name: Create the host's instance registry directory
  ansible.builtin.file:
    path: "{{ steam_registry_dir }}"
    state: directory
    owner: "{{ steam_system_user }}"
    group: "{{ steam_system_user }}"
    mode: '0750'
  become: true

- name: Read the installed build id, if the app is already installed
  ansible.builtin.include_tasks: read_buildid.yaml

- name: Read this instance's existing registry entry, if any
  ansible.builtin.slurp:
    src: "{{ steam_registry_dir }}/{{ steam_gameserver_instance_name }}.yaml"
  become: true
  register: steam_gameserver_instance_registry_raw
  failed_when: false

- name: Remember whether this is a first install
  # Captured before app_update.yaml runs — it re-reads the manifest, so
  # manifest.stat.exists is always true afterwards.
  ansible.builtin.set_fact:
    steam_gameserver_instance_fresh_install: "{{ (not steam_gameserver_instance_manifest.stat.exists) | bool }}"

- name: Install the app via SteamCMD (first install only)
  ansible.builtin.include_tasks: app_update.yaml
  when: steam_gameserver_instance_fresh_install

- name: Work out which branch is actually installed
  # First install: the declared branch (just installed). Already installed
  # and registered: whatever the registry recorded. Already installed but
  # not registered yet (instances deployed before the registry existed):
  # "public" — before the registry, no -beta flag could be passed at all,
  # so a pre-registry install can only be on the default branch.
  ansible.builtin.set_fact:
    steam_gameserver_instance_applied_branch: >-
      {{ steam_gameserver_instance_beta_branch
         if steam_gameserver_instance_fresh_install
         else ((steam_gameserver_instance_registry_raw.content | b64decode | from_yaml).applied_branch
               if steam_gameserver_instance_registry_raw.content is defined
               else 'public') }}
    steam_gameserver_instance_applied_buildid: "{{ steam_gameserver_instance_buildid }}"

- name: Record this instance in the host's registry
  ansible.builtin.include_tasks: register.yaml

- name: Note a pending branch change
  ansible.builtin.debug:
    msg: >-
      {{ steam_gameserver_instance_name }}: declared branch
      "{{ steam_gameserver_instance_beta_branch }}" differs from the installed
      branch "{{ steam_gameserver_instance_applied_branch }}". Nothing was changed on the
      install — apply it with update-steam_gameserver.yaml (see README.md
      "Updating game servers" for the confirmation it requires).
  when: steam_gameserver_instance_beta_branch != steam_gameserver_instance_applied_branch

- name: Render the instance's systemd unit
  ansible.builtin.template:
    src: steam-gameserver.service.j2
    dest: "/etc/systemd/system/steam-{{ steam_gameserver_instance_name }}.service"
    owner: root
    group: root
    mode: '0644'
  become: true
  notify:
    - Reload systemd
    - Check whether the steam gameserver instance is running
    - Restart steam gameserver instance

- name: Allow this instance's game port(s)/protocol(s) through ufw
  # Opens every (port, protocol) combination — steam_gameserver_instance_extra_ports
  # covers games needing more than one port (e.g. Valheim: base port + 2
  # more), steam_gameserver_instance_extra_protocols covers a port needing
  # more than one protocol (e.g. Valheim: TCP as well as UDP, per
  # conflicting guidance on whether it's actually required — cheap to open
  # both). Both empty by default, so a single-port/single-protocol game
  # like HLDS gets exactly the one rule it always did.
  community.general.ufw:
    rule: allow
    port: "{{ item.0 | string }}"
    proto: "{{ item.1 }}"
    src: "{{ steam_gameserver_instance_source_cidr }}"
  loop: "{{ ([steam_gameserver_instance_port] + steam_gameserver_instance_extra_ports)
            | product([steam_gameserver_instance_proto] + steam_gameserver_instance_extra_protocols)
            | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"
  become: true

- name: Flush handlers so the unit file is current before we (re)start it
  ansible.builtin.meta: flush_handlers

- name: Ensure the instance is enabled and started
  # Tagged so an instance can be deployed/registered while deliberately
  # left stopped (e.g. during maintenance): --skip-tags start,verify
  ansible.builtin.systemd:
    name: "steam-{{ steam_gameserver_instance_name }}"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  tags: start
