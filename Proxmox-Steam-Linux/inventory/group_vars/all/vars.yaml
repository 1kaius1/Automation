---
# Global, non-secret variables shared by every play in this project.

ssh_private_key_path: "{{ playbook_dir }}/ssh_keys/id_ed25519"
ssh_public_key_path: "{{ playbook_dir }}/ssh_keys/id_ed25519.pub"

ansible_python_interpreter: /usr/bin/python3

# Per-host registry of the game-server instances installed on a Steam-Linux
# host: one <instance-name>.yaml per instance, written by
# create-steam_gameserver.yaml and read by update-steam_gameserver.yaml.
# Lives on the HOST (on the /opt disk, so the whole-VM backup covers it),
# not on the control node — see README.md "Updating game servers".
steam_registry_dir: "{{ steam_home_dir }}/.registry"
