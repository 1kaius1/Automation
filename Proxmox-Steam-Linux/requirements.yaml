---
# Ansible Galaxy Requirements
# ============================
# Collections needed for the Steam-Linux deployment. Install with:
#   ansible-galaxy collection install -r requirements.yaml

collections:
  # Proxmox VM/disk/backup/info modules. NOT community.general.proxmox,
  # which is deprecated.
  - name: community.proxmox
    version: ">=1.5.0"

  # ufw firewall module
  - name: community.general
    version: ">=8.0.0"
