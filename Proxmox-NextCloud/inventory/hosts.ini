# Ansible Inventory for NextCloud/Collabora Deployment
# =====================================================

# Local machine - used for Proxmox API calls and orchestration
[local]
localhost ansible_connection=local

# NextCloud container - populated dynamically by create_nextcloud_container role
# The container IP will be added here when the container is created
[nextcloud]
# Will be populated by add_host task during playbook execution

# Collabora container - populated dynamically by create_collabora_container role
# The container IP will be added here when the container is created
[collabora]
# Will be populated by add_host task during playbook execution
