# Ansible Configuration File
# ==========================
# This file configures Ansible behavior for the NextCloud deployment

[defaults]
# Suppress deprecation warnings to reduce console noise
deprecation_warnings = False

# Specify the inventory file location
inventory = ./inventory/hosts.ini

# Don't create .retry files on failure (clutters the workspace)
retry_files_enabled = False

# Use colored output for better readability
force_color = True

# Increase connection timeout for slower networks or busy systems
timeout = 30

# Don't check SSH host keys (useful for dynamic containers)
# WARNING: Only use this in trusted networks
host_key_checking = False

# Show task execution time
callback_whitelist = timer, profile_tasks

# Gather facts in parallel for better performance
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

[ssh_connection]
# Use SSH pipelining for better performance (fewer SSH operations)
pipelining = True

# Reduce SSH connection time
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
