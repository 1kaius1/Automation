---
# ============================================
# Create NextCloud LXC Container Role
# ============================================
#
# This role creates an LXC container on Proxmox for NextCloud installation.
# It uses the Proxmox API to create the container with specified resources.
#
# Prerequisites:
#   - Valid Proxmox API credentials
#   - LXC template downloaded in Proxmox
#   - Storage pool available
#   - Network bridge configured
#
# Variables required (passed from main playbook):
#   - proxmox_api_host: Proxmox host IP/FQDN
#   - proxmox_api_token_id: API token ID for authentication
#   - proxmox_api_token_secret: API token secret
#   - proxmox_node: Proxmox node name
#   - nextcloud_hostname: Hostname for the container
#   - lxc_template: Template file name
#   - template_storage: Storage location for templates
#   - storage_pool: Storage pool for container disks
#   - nextcloud_cores: Number of CPU cores
#   - nextcloud_memory: RAM in MB
#   - nextcloud_swap: Swap in MB (512)
#   - nextcloud_root_disk_size: Root disk size in GB
#   - nextcloud_data_disk_size: Data disk size in GB
#   - network_bridge: Network bridge name
#   - nextcloud_ip_config: IP configuration (dhcp or static)
#   - container_root_password: Root password for the container
#   - ssh_public_key_path: Path to SSH public key
#
# Outputs:
#   - Sets nextcloud_vmid fact with the assigned VMID
#   - Sets nextcloud_container_ip fact with the container's IP address
#
# ============================================

# ============================================
# Step 1: Get Next Available VMID
# ============================================

- name: Get next available VMID from Proxmox API
  # Query Proxmox for the next available VMID right before creation
  # This ensures we get an actually available ID
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/cluster/nextid"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    validate_certs: no
  register: next_vmid_response
  delegate_to: localhost

- name: Set NextCloud VMID
  # Extract and assign the VMID for this container
  ansible.builtin.set_fact:
    nextcloud_vmid: "{{ next_vmid_response.json.data | int }}"

- name: Verify VMID is valid
  # Sanity check - VMID should be >= 100
  ansible.builtin.fail:
    msg: |
      ❌ Invalid VMID received from Proxmox: {{ nextcloud_vmid }}
      
      VMIDs should typically be >= 100.
      This indicates a problem with the Proxmox API query.
  when: nextcloud_vmid | int < 100
  delegate_to: localhost

# ============================================
# Step 2: Display Container Information
# ============================================

- name: Display container creation information
  ansible.builtin.debug:
    msg: |
      Creating NextCloud LXC container with the following specifications:
      - VMID: {{ nextcloud_vmid }}
      - Hostname: {{ nextcloud_hostname }}
      - Cores: {{ nextcloud_cores }}
      - Memory: {{ nextcloud_memory }} MB
      - Swap: {{ nextcloud_swap }} MB
      - Root Disk: {{ nextcloud_root_disk_size }} GB
      - Data Disk: {{ nextcloud_data_disk_size }} GB
      - Template: {{ lxc_template }}
      - Storage: {{ storage_pool }}
      - Network: {{ network_bridge }} ({{ nextcloud_ip_config }})

- name: DEBUG - Show API parameters being passed to module
  ansible.builtin.debug:
    msg: |
      🔍 API Parameters:
      api_host: {{ proxmox_api_host }}
      api_user: {{ proxmox_api_token_id.split('!')[0] }}
      api_token_id: {{ proxmox_api_token_id.split('!')[1] }}
      api_token_secret: [REDACTED]
      node: {{ proxmox_node }}

- name: Check if SSH public key exists
  # Verify the SSH public key file exists before trying to use it
  # This key will be injected into the container for passwordless SSH access
  ansible.builtin.stat:
    path: "{{ ssh_public_key_path }}"
  register: ssh_key_stat
  delegate_to: localhost

- name: Fail if SSH public key not found
  ansible.builtin.fail:
    msg: |
      SSH public key not found at: {{ ssh_public_key_path }}
      Please run setup_ssh.sh to generate SSH keys before running this playbook.
  when: not ssh_key_stat.stat.exists

- name: Read SSH public key
  # Load the SSH public key content so we can inject it into the container
  ansible.builtin.slurp:
    path: "{{ ssh_public_key_path }}"
  register: ssh_public_key_content
  delegate_to: localhost

- name: Set SSH public key fact
  # Decode the base64-encoded key content
  ansible.builtin.set_fact:
    ssh_public_key: "{{ ssh_public_key_content.content | b64decode | trim }}"

# ============================================
# Step 2: Check if Container Already Exists
# ============================================

- name: Get list of all LXC containers on node
  # Query Proxmox API for all LXC containers to check for name conflicts
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    validate_certs: no
  register: all_containers
  delegate_to: localhost

- name: Check if container with this hostname already exists
  # Search through all containers to find one with matching hostname
  ansible.builtin.set_fact:
    existing_container_by_name: "{{ all_containers.json.data | selectattr('name', 'equalto', nextcloud_hostname) | list | first | default(none) }}"
  delegate_to: localhost

- name: Display error if container with same name exists
  ansible.builtin.debug:
    msg: |
      ⚠️  WARNING: A container named '{{ nextcloud_hostname }}' already exists!
      
      Existing container details:
      - VMID: {{ existing_container_by_name.vmid }}
      - Name: {{ existing_container_by_name.name }}
      - Status: {{ existing_container_by_name.status }}
      
      You have the following options:
      1. Delete the existing container manually in Proxmox and re-run
      2. Change 'nextcloud_hostname' in your config.yaml to a different name
      3. Use the existing container (skip creation)
  when: existing_container_by_name is not none

- name: Fail if container with same name exists
  ansible.builtin.fail:
    msg: |
      ❌ Cannot create container: A container named '{{ nextcloud_hostname }}' already exists (VMID {{ existing_container_by_name.vmid }})
      
      To resolve this:
      
      Option 1 - Delete the existing container:
        1. In Proxmox UI, stop and delete VMID {{ existing_container_by_name.vmid }}
        2. Re-run this playbook
      
      Option 2 - Use a different name:
        1. Edit config.yaml
        2. Change nextcloud_hostname to something else (e.g., "nextcloud2")
        3. Re-run this playbook
      
      Option 3 - Use the existing container:
        If VMID {{ existing_container_by_name.vmid }} is the container you want to configure,
        you'll need to manually set up NextCloud on it.
  when: existing_container_by_name is not none
  delegate_to: localhost

- name: Check if container with this VMID already exists
  # Also check if our auto-assigned VMID is already taken
  # This is a secondary check - the hostname check above is primary
  community.general.proxmox:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_token_id.split('!')[0] }}"
    api_token_id: "{{ proxmox_api_token_id.split('!')[1] }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: no
    node: "{{ proxmox_node }}"
    vmid: "{{ nextcloud_vmid }}"
    state: current
  register: existing_container_by_vmid
  failed_when: false
  delegate_to: localhost

- name: Display warning if VMID is taken (but different name)
  ansible.builtin.debug:
    msg: |
      ⚠️  The auto-assigned VMID {{ nextcloud_vmid }} is already in use.
      This shouldn't happen as we queried for next available VMID.
      Will try to create anyway - Proxmox will assign a different VMID if needed.
  when: 
    - existing_container_by_vmid.status is defined 
    - existing_container_by_vmid.status == "present"
    - existing_container_by_name is none

# ============================================
# Step 3: Create LXC Container
# ============================================

- name: Create NextCloud LXC container
  # Create the container with all specified parameters
  # The container is created as unprivileged for better security
  # Nesting is enabled in case we need to run Docker later
  community.general.proxmox:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_token_id.split('!')[0] }}"
    api_token_id: "{{ proxmox_api_token_id.split('!')[1] }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: no
    node: "{{ proxmox_node }}"
    vmid: "{{ nextcloud_vmid }}"
    hostname: "{{ nextcloud_hostname }}"
    ostemplate: "{{ template_storage }}:vztmpl/{{ lxc_template }}"
    cores: "{{ nextcloud_cores }}"
    memory: "{{ nextcloud_memory }}"
    swap: "{{ nextcloud_swap }}"
    # Root disk on the specified storage pool
    disk: "{{ storage_pool }}:{{ nextcloud_root_disk_size }}"
    # Additional mount point for NextCloud data
    # This separates user data from the OS for easier management
    mounts:
      mp0: "{{ storage_pool }}:{{ nextcloud_data_disk_size }},mp=/var/www/nextcloud/data"
    # Network configuration
    netif:
      net0: "name=eth0,bridge={{ network_bridge }},ip={{ nextcloud_ip_config }},firewall=1"
    # Security settings
    unprivileged: yes
    onboot: yes  # Start container automatically when Proxmox boots
    # Authentication
    password: "{{ container_root_password }}"
    pubkey: "{{ ssh_public_key }}"
    # Features
    features:
      - nesting=1  # Allow running containers inside this container (for Docker if needed)
    state: present
  register: container_create
  delegate_to: localhost

- name: Display container creation result
  ansible.builtin.debug:
    msg: "NextCloud container created successfully with VMID {{ nextcloud_vmid }}"
  when: container_create.changed

# ============================================
# Step 4: Start the Container
# ============================================

- name: Start NextCloud container
  # Start the container so it's ready for configuration
  community.general.proxmox:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_token_id.split('!')[0] }}"
    api_token_id: "{{ proxmox_api_token_id.split('!')[1] }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: no
    node: "{{ proxmox_node }}"
    vmid: "{{ nextcloud_vmid }}"
    state: started
  register: container_start
  delegate_to: localhost

- name: Wait for container to boot
  # Give the container time to fully start up
  # This ensures the network interface is up and SSH is ready
  ansible.builtin.pause:
    seconds: 30
    prompt: "Waiting for container to boot and network to initialize..."

# ============================================
# Step 5: Get Container IP Address
# ============================================

- name: Check if using static IP or DHCP
  ansible.builtin.set_fact:
    using_dhcp: "{{ nextcloud_ip_config == 'dhcp' }}"
  delegate_to: localhost

- name: Extract static IP if configured
  ansible.builtin.set_fact:
    nextcloud_container_ip: "{{ nextcloud_ip_config.split(',')[0].split('/')[0] }}"
  when: not using_dhcp
  delegate_to: localhost

- name: Get container config from Proxmox API for DHCP IP
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc/{{ nextcloud_vmid }}/status/current"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    validate_certs: no
  register: container_status
  when: using_dhcp
  delegate_to: localhost
  retries: 10
  delay: 3
  until: container_status.status == 200 and container_status.json.data.status == "running"

- name: Wait for DHCP lease to be assigned
  ansible.builtin.pause:
    seconds: 10
    prompt: "Waiting for DHCP IP assignment..."
  when: using_dhcp

- name: Get container network interfaces from Proxmox API
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc/{{ nextcloud_vmid }}/interfaces"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    validate_certs: no
  register: container_interfaces
  when: using_dhcp
  delegate_to: localhost

- name: Extract DHCP IP from interface data
  ansible.builtin.set_fact:
    nextcloud_container_ip: "{{ container_interfaces.json.data | selectattr('name', 'equalto', 'eth0') | map(attribute='inet') | first | regex_replace('/.*$', '') }}"
  when: using_dhcp
  delegate_to: localhost

- name: Display container IP address
  ansible.builtin.debug:
    msg: |
      NextCloud container is running!
      IP Address: {{ nextcloud_container_ip }}
      IP Type: {{ 'DHCP' if using_dhcp else 'Static' }}
      You can SSH to it with: ssh -i {{ ssh_private_key_path }} root@{{ nextcloud_container_ip }}

- name: Fail if no IP address found
  ansible.builtin.fail:
    msg: |
      Could not determine container IP address.
      This might indicate a network configuration problem.
      Please check the container's network settings in Proxmox.
  when: nextcloud_container_ip is not defined or nextcloud_container_ip == ""

# ============================================
# Step 6: Wait for SSH to be Available
# ============================================

- name: DEBUG - Display IP before SSH wait
  ansible.builtin.debug:
    msg: |
      About to wait for SSH on: {{ nextcloud_container_ip }}
      Type: {{ nextcloud_container_ip | type_debug }}
      Defined: {{ nextcloud_container_ip is defined }}
  delegate_to: localhost

- name: Wait for SSH to become available on container
  # Try to connect to SSH on the container
  # This ensures the container is fully ready before we proceed
  ansible.builtin.wait_for:
    host: "{{ nextcloud_container_ip }}"
    port: 22
    delay: 5
    timeout: 300
    state: started
    connect_timeout: 5
  delegate_to: localhost
  vars:
    ansible_connection: local

- name: Test SSH connection to container
  # Verify we can actually execute commands via SSH
  ansible.builtin.command: ssh -i {{ ssh_private_key_path }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@{{ nextcloud_container_ip }} "echo 'SSH connection successful'"
  register: ssh_test
  changed_when: false
  delegate_to: localhost
  # Retry a few times as SSH might not be fully ready
  retries: 3
  delay: 10
  until: ssh_test.rc == 0

# ============================================
# Step 7: Verify Data Mount Point
# ============================================

- name: Verify data directory mount point
  # Check that the data mount point was created and is accessible
  ansible.builtin.command: ssh -i {{ ssh_private_key_path }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@{{ nextcloud_container_ip }} "mountpoint -q /var/www/nextcloud/data"
  register: mount_check
  changed_when: false
  failed_when: mount_check.rc != 0
  delegate_to: localhost

- name: Display mount verification
  ansible.builtin.debug:
    msg: "Data directory mount point verified at /var/www/nextcloud/data"

# ============================================
# Step 8: Set Container Facts for Later Use
# ============================================

- name: Add container to inventory
  # Dynamically add the container to the 'nextcloud' group in inventory
  # This allows subsequent roles to target it directly
  ansible.builtin.add_host:
    name: "{{ nextcloud_container_ip }}"
    groups: nextcloud
    ansible_host: "{{ nextcloud_container_ip }}"
    ansible_user: root
    ansible_ssh_private_key_file: "{{ ssh_private_key_path }}"
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

- name: Set NextCloud container facts
  # Store container information as facts for use by other roles
  ansible.builtin.set_fact:
    nextcloud_container_created: true
    nextcloud_container_vmid: "{{ nextcloud_vmid }}"
    nextcloud_container_ip: "{{ nextcloud_container_ip }}"
    cacheable: yes

- name: Container creation complete
  ansible.builtin.debug:
    msg: |
      ============================================
      ✅ NextCloud Container Created Successfully
      ============================================
      
      Container Details:
      - VMID: {{ nextcloud_vmid }}
      - Hostname: {{ nextcloud_hostname }}
      - IP Address: {{ nextcloud_container_ip }}
      - Root Disk: {{ nextcloud_root_disk_size }} GB
      - Data Disk: {{ nextcloud_data_disk_size }} GB (mounted at /var/www/nextcloud/data)
      
      The container is ready for NextCloud installation.

# ============================================
# End of Create NextCloud Container Role
# ============================================

